<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="ktjs-echarts example gallery: the official ECharts examples ported to Kotlin/JS. ECharts 官方示例的 Kotlin/JS 移植。">
    <title>ktjs-echarts · Example gallery</title>
    <link rel="icon" href="img/ktjs-echarts-logo.png">
    <!-- Lumo's design tokens and the utility classes the shell uses; copied from the npm workspace. -->
    <link rel="stylesheet" href="lumo.css">
    <link rel="stylesheet" href="utility.css">
    <script src="demo.js" defer></script>
</head>
<body>
<!--
  The shell is named here, not created by the script: `main` defines the tags and mounts the menu into
  the element the browser built, so there is exactly one `<ktjs-demo-layout>` on the page.
-->
<ktjs-demo-layout id="demo"></ktjs-demo-layout>
<noscript>This gallery is built with Kotlin/JS and needs JavaScript. 这个示例站由 Kotlin/JS 构建，需要启用 JavaScript。</noscript>
</body>
</html>
